# Reusable build workflow for mbt v2 (cc370 host build) projects.
#
# No MVS: builds + installs the cc370 toolchain on the runner, then runs
# the host build (compile -> link -> library). MVS is only touched by
# `make deploy`, which CI does not run.
#
# Usage in consumer project (.github/workflows/build.yml):
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#
#   jobs:
#     build:
#       uses: mvslovers/mbt/.github/workflows/build.yml@main
#
# The toolchain floats on main here by design, and the [toolchain] section of
# project.toml is deliberately NOT honoured: a PR built against the tip of
# cc370/libc370 is the early warning that catches a toolchain regression before
# it reaches a consumer. Pinning it here would hide the break until someone
# bumped the version. release.yml is the one that pins, so a published artifact
# stays reproducible (issue #67).
#
# The cc370_ref / libc370_ref inputs are the exception, for a temporary hold
# only: a consumer that cannot follow a breaking toolchain change yet sets
#
#   jobs:
#     build:
#       uses: mvslovers/mbt/.github/workflows/build.yml@main
#       with:
#         libc370_ref: v1.0.8
#
# and removes the line again in the PR that migrates it (issue #121). The
# default stays main.
#
# Legacy (v1, mvsMF/JCL) projects use build-legacy.yml instead.

name: Build

on:
  workflow_call:
    inputs:
      cc370_ref:
        description: "cc370 git ref (branch, tag or SHA) to build the toolchain from"
        type: string
        default: "main"
      libc370_ref:
        description: "libc370 git ref (branch, tag or SHA) to build the sysroot from"
        type: string
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone toolchain (cc370 + libc370)
        env:
          CC370_REF: ${{ inputs.cc370_ref }}
          LIBC370_REF: ${{ inputs.libc370_ref }}
        run: |
          echo "[mbt] cc370   @ $CC370_REF"
          echo "[mbt] libc370 @ $LIBC370_REF"
          # fetch-by-ref rather than `clone --branch`, which cannot take a
          # commit SHA. Same helper as release.yml.
          fetch_at() {   # $1 repo, $2 ref, $3 target dir
            git init -q "$3"
            git -C "$3" remote add origin "https://github.com/mvslovers/$1.git"
            if ! git -C "$3" fetch -q --depth 1 origin "$2"; then
              echo "[mbt] ERROR: $1: no such ref '$2'" >&2
              exit 1
            fi
            git -C "$3" checkout -q --detach FETCH_HEAD
          }
          fetch_at cc370   "$CC370_REF"   /tmp/cc370
          fetch_at libc370 "$LIBC370_REF" /tmp/libc370
          echo "TC_KEY=$(git -C /tmp/cc370 rev-parse HEAD)-$(git -C /tmp/libc370 rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache toolchain (cc370 compiler + libc370 sysroot)
        id: tc-cache
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: cc370-${{ runner.os }}-${{ env.TC_KEY }}

      - name: Build + install toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex
          # 1. compiler + tools (cc370/as370/ld370/ar370)
          make -C /tmp/cc370 install PREFIX="$HOME/.local"
          export PATH="$HOME/.local/bin:$PATH"
          # 2. libc370 sysroot (headers, crt*.o, libc.a, macros); built with cc370
          make -C /tmp/libc370 install

      - name: Add cc370 to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Dependencies
        run: make deps
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build modules
        run: make

      - name: Build tests
        run: make test

      - name: Build library
        run: make lib
