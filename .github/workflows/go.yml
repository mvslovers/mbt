# CI for mbt itself: the mbt 3 Go code (cmd/, internal/) on every PR and
# push to main. No toolchain on the runner -- the unit tests need neither
# cc370 nor MVS. The byte-for-byte comparison with v2 (internals/acceptance/)
# needs both and stays a local run.
name: go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/mbt
