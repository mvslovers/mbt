# mbt releases itself: a v3 tag builds the Go binary for every platform and
# publishes it, with a SHA256 list, as a GitHub release of mvslovers/mbt.
# The launcher (internal/launch) fetches exactly these assets:
#
#   mbt-<version>-<os>-<arch>.tar.gz     (.zip for windows), holding mbt
#   mbt-<version>-sha256.txt
#
# Beside them, the manuals ML02-0001 and ML02-0002 as PDFs, with their lines in
# the SHA256 list.
#
# A tag with a '-' (v3.0.0-dev) is a prerelease and may be re-pushed: the
# release of that tag is deleted and created again, as for every project.
# A tag without a '-' is created as Latest (from v3.0.0 on, mbt 3 is the
# current line) and its notes say where mbt 2 users find v2.x.
# The v2 tags (v2.x) are not built here -- mbt 2 is the submodule.

name: mbt release

on:
  push:
    tags: ["v3.*", "v4.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # docs/books/bookmaster, for the manuals
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build every platform
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # stage/ and dist/ outside the checkout: an untracked file in it
          # makes Go stamp every later binary "+dirty" (mbt version)
          OUT="$RUNNER_TEMP"
          mkdir -p "$OUT/dist"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="mbt-$VER-$os-$arch"
            exe=mbt; [ "$os" = windows ] && exe=mbt.exe
            mkdir -p "$OUT/stage/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.mbtVersion=$VER" -o "$OUT/stage/$name/$exe" ./cmd/mbt
            if [ "$os" = windows ]; then
              (cd "$OUT/stage" && zip -q -r "$OUT/dist/$name.zip" "$name")
            else
              tar -C "$OUT/stage" -czf "$OUT/dist/$name.tar.gz" "$name"
            fi
          done
          # the manuals, built from the tag, ride along under their document
          # numbers (ml02-000N-E.pdf) and get their lines in the SHA256 list
          f=typst-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL --proto "=https" --tlsv1.2 -o "$RUNNER_TEMP/$f" "https://github.com/typst/typst/releases/download/v0.15.1/$f"
          (cd "$RUNNER_TEMP" && echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $f" | sha256sum -c -)
          tar -xf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/typst-x86_64-unknown-linux-musl:$PATH" make -C docs/books
          cp docs/books/*.pdf "$OUT/dist/"
          rm -f docs/books/*.pdf    # keep the checkout clean for the next build
          (cd "$OUT/dist" && sha256sum mbt-* ml02-* > "mbt-$VER-sha256.txt")
          cat "$OUT/dist/mbt-$VER-sha256.txt"

      - name: The binary reports its version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          tar -xzf "$RUNNER_TEMP/dist/mbt-$VER-linux-amd64.tar.gz" -C /tmp
          got=$(MBT_NO_SWITCH=1 /tmp/mbt-$VER-linux-amd64/mbt version)
          echo "$got"
          case "$got" in *dirty*) echo "built from a modified tree" >&2; exit 1 ;; esac
          case "$got" in "mbt $VER"|"mbt $VER ("*) ;; *) exit 1 ;; esac

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          PRE=""; LATEST="--latest=false"; NOTES=()
          case "$TAG" in
            *-*) PRE="--prerelease" ;;
            *)
              # a tag without '-' is a release of the current line: Latest
              LATEST="--latest"
              cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Using mbt 2?** It is not part of this release line. mbt 2, the git submodule with a \`project.toml\` and a two-line \`Makefile\`, stays on the \`v2.*\` tags; its newest release at the time of $TAG is [v2.2.0](https://github.com/${{ github.repository }}/releases/tag/v2.2.0) (\`git -C mbt checkout v2.2.0\`). \`docs/MIGRATION.md\` describes the move to mbt 3.

          EOF
              NOTES=(--notes-file "$RUNNER_TEMP/notes.md")
              ;;
          esac
          gh release create "$TAG" $PRE "$LATEST" --title "$TAG" \
            "${NOTES[@]}" --generate-notes "$RUNNER_TEMP"/dist/*
